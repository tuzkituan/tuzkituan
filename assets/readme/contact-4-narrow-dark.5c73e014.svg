<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="176" viewBox="0 0 500 88">
<style>@font-face{font-family:tz-mono;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:tz-monoBold;src:url(data:font/woff2;base64,) format('woff2')}
text{white-space:pre}
.mono{font-family:tz-mono,ui-monospace,monospace}
.monoBold{font-family:tz-monoBold,ui-monospace,monospace}
.show{animation:show .01s both}@keyframes show{from{opacity:0}}
.type{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0)}@keyframes type{from{transform:scaleX(1)}}
.cursor{animation:blink 1.1s infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="499" height="71" fill="#0d1014" stroke="rgba(255,255,255,.14)"/><text x="32" y="44" class="monoBold" font-size="20" fill="#ffffff" text-anchor="start">Google Play</text><text x="468" y="43" class="mono" font-size="12" fill="rgba(216,219,224,.42)" text-anchor="end">play.google.com</text>
</svg>
